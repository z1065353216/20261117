plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.thiefadblock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.thiefadblock'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Xposed/LSPosed 提供运行时 API，不能打包进模块 APK。
    compileOnly 'de.robv.android.xposed:api:82'
}
